<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Визуализатор стеновых панелей</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: #eee;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 340px;
      padding: 20px;
      background: #2b2b2b;
      box-sizing: border-box;
      overflow-y: auto;
      flex-shrink: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
      background: #111;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .mode-desc {
      margin-top: 6px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.4;
    }

    .result {
      margin-top: 20px;
      padding: 12px;
      background: #1a1a1a;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 14px;
    }

    .canvas-wrap {
      flex: 1;
      overflow: auto;
      padding: 30px;
      box-sizing: border-box;
    }

    .workspace {
      min-width: max-content;
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }

    .visual-block {
      width: max-content;
    }

    .visual-title {
      margin: 0 0 12px 36px;
      font-size: 16px;
      font-weight: bold;
      color: #ddd;
    }

    .layout {
      position: relative;
      flex-shrink: 0;
    }

    #columnLabels,
    #rowLabels,
    #wall {
      position: absolute;
    }

    #columnLabels {
      left: 36px;
      top: 0;
      height: 28px;
    }

    #rowLabels {
      left: 0;
      top: 36px;
      width: 28px;
    }

    #wall {
      left: 36px;
      top: 36px;
      background: #f2f2f2;
      box-shadow: 0 0 30px rgba(0,0,0,.55);
    }

    .axis-label {
      position: absolute;
      color: #ddd;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .column-label {
      height: 28px;
      top: 0;
    }

    .row-label {
      width: 28px;
      left: 0;
    }

    .panel {
      position: absolute;
      background: linear-gradient(135deg, #d8b37a, #b88645);
      border: 1px solid rgba(0,0,0,.4);
      box-sizing: border-box;
      font-size: 11px;
      color: rgba(0,0,0,.85);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      white-space: nowrap;
      text-align: center;
      line-height: 1.2;
    }

    .cut {
      background: linear-gradient(135deg, #c78a5a, #9f5f34);
      font-weight: bold;
    }

    .cut-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .small-panel {
      font-size: 9px;
    }

    .tiny-panel {
      font-size: 8px;
    }

    .leftovers-block {
      width: 100%;
      max-width: 1300px;
      box-sizing: border-box;
      background: #181818;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px;
    }

    .leftovers-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .leftovers-summary {
      color: #bbb;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .leftovers-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
    }

    .leftover-card {
      background: #222;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      padding: 10px;
      min-width: 190px;
    }

    .leftover-card-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #eee;
    }

    .leftover-pieces {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 8px;
    }

    .leftover-piece {
      background: linear-gradient(135deg, #6f8f5b, #3f6535);
      border: 1px solid rgba(255,255,255,.22);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #f3ffe8;
      font-size: 11px;
      line-height: 1.15;
      overflow: hidden;
      border-radius: 3px;
      user-select: none;
    }

    .no-leftovers {
      color: #aaa;
      font-size: 13px;
    }

    .legend {
      margin-top: 12px;
      font-size: 13px;
      opacity: .85;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>Раскладка панелей</h2>

  <label>Ширина стены, см</label>
  <input id="wallWidth" type="number" value="500">

  <label>Высота стены, см</label>
  <input id="wallHeight" type="number" value="240">

  <label>Ширина панели, см</label>
  <input id="panelWidth" type="number" value="70">

  <label>Высота панели, см</label>
  <input id="panelHeight" type="number" value="70">

  <label>Ориентация панели</label>
  <select id="orientation">
    <option value="normal">Обычная</option>
    <option value="rotated">Повернуть на 90°</option>
  </select>

  <label>Режим расчёта покупки</label>
  <select id="purchaseMode" onchange="updateModeDesc()">
    <option value="economy" selected>Экономичный</option>
    <option value="minimal">Минимальный</option>
  </select>
  <div class="mode-desc" id="modeDesc">
    Остатки от подрезок используются повторно без ограничения уровней.
  </div>

  <button onclick="render()">Рассчитать</button>

  <div class="result" id="result"></div>
</div>

<div class="canvas-wrap">
  <div class="workspace">
    <div class="visual-block">
      <div class="visual-title">Стена</div>
      <div class="layout" id="layout">
        <div id="columnLabels"></div>
        <div id="rowLabels"></div>
        <div id="wall"></div>
      </div>
    </div>

    <div class="leftovers-block" id="leftoversBlock">
      <div class="leftovers-title">Остатки после раскроя</div>
      <div class="leftovers-summary" id="leftoversSummary"></div>
      <div class="leftovers-grid" id="leftoversVisual"></div>
    </div>
  </div>
</div>

<script>
function updateModeDesc() {
  const mode = document.getElementById('purchaseMode').value;
  const desc = document.getElementById('modeDesc');
  if (mode === 'economy') {
    desc.textContent = 'Экономичный: остатки можно использовать повторно без ограничения уровней. Подрезка на стене может быть набрана несколькими кусками.';
  } else {
    desc.textContent = 'Минимальный: только 1 уровень подрезок. Каждое место подрезки закрывается одним куском из отдельной цельной панели.';
  }
}

function render() {
  const wallW = Number(document.getElementById('wallWidth').value);
  const wallH = Number(document.getElementById('wallHeight').value);

  let panelW = Number(document.getElementById('panelWidth').value);
  let panelH = Number(document.getElementById('panelHeight').value);

  const orientation = document.getElementById('orientation').value;
  const purchaseMode = document.getElementById('purchaseMode').value;

  const result = document.getElementById('result');
  const layout = document.getElementById('layout');
  const wall = document.getElementById('wall');
  const columnLabels = document.getElementById('columnLabels');
  const rowLabels = document.getElementById('rowLabels');
  const leftoversSummary = document.getElementById('leftoversSummary');
  const leftoversVisual = document.getElementById('leftoversVisual');

  if (!wallW || !wallH || !panelW || !panelH) {
    result.innerHTML = 'Заполни все размеры.';
    clearVisuals();
    return;
  }

  if (wallW <= 0 || wallH <= 0 || panelW <= 0 || panelH <= 0) {
    result.innerHTML = 'Размеры должны быть больше нуля.';
    clearVisuals();
    return;
  }

  if (orientation === 'rotated') {
    [panelW, panelH] = [panelH, panelW];
  }

  wall.innerHTML = '';
  columnLabels.innerHTML = '';
  rowLabels.innerHTML = '';
  leftoversSummary.innerHTML = '';
  leftoversVisual.innerHTML = '';

  const sidebarW = 340;
  const padding = 110;
  const axisOffset = 36;

  const availableW = window.innerWidth - sidebarW - padding - axisOffset;
  const availableH = Math.max(260, window.innerHeight - 360 - axisOffset);
  const scale = Math.min(availableW / wallW, availableH / wallH);

  const wallPxW = wallW * scale;
  const wallPxH = wallH * scale;

  layout.style.width = wallPxW + axisOffset + 'px';
  layout.style.height = wallPxH + axisOffset + 'px';
  wall.style.width = wallPxW + 'px';
  wall.style.height = wallPxH + 'px';
  columnLabels.style.width = wallPxW + 'px';
  rowLabels.style.height = wallPxH + 'px';

  const cells = [];
  const cuts = [];
  let fullPanels = 0;
  let totalPlaces = 0;

  let y = 0;
  let rowIndex = 0;

  while (y < wallH) {
    const currentH = Math.min(panelH, wallH - y);

    const rowLabel = document.createElement('div');
    rowLabel.className = 'axis-label row-label';
    rowLabel.style.top = y * scale + 'px';
    rowLabel.style.height = currentH * scale + 'px';
    rowLabel.textContent = rowIndex + 1;
    rowLabels.appendChild(rowLabel);

    let x = 0;
    let colIndex = 0;

    while (x < wallW) {
      const currentW = Math.min(panelW, wallW - x);
      const isFull = same(currentW, panelW) && same(currentH, panelH);
      const cellName = `${colIndex + 1}.${rowIndex + 1}`;

      if (rowIndex === 0) {
        const columnLabel = document.createElement('div');
        columnLabel.className = 'axis-label column-label';
        columnLabel.style.left = x * scale + 'px';
        columnLabel.style.width = currentW * scale + 'px';
        columnLabel.textContent = colIndex + 1;
        columnLabels.appendChild(columnLabel);
      }

      const cell = { x, y, width: currentW, height: currentH, isFull, cellName, cutNumber: null, pieces: null };
      cells.push(cell);
      totalPlaces++;

      if (isFull) {
        fullPanels++;
      } else {
        cell.cutNumber = cuts.length + 1;
        cuts.push({
          number: cell.cutNumber,
          cell: cellName,
          width: currentW,
          height: currentH,
          area: currentW * currentH,
          cellRef: cell
        });
      }

      x += panelW;
      colIndex++;
    }

    y += panelH;
    rowIndex++;
  }

  const minimalCutResult = calculateMinimalCuts(cuts, panelW, panelH);
  const economyCutResult = calculateEconomyCuts(cuts, panelW, panelH);

  const selectedCutResult = purchaseMode === 'economy' ? economyCutResult : minimalCutResult;
  const selectedPanelsNeeded = fullPanels + selectedCutResult.panelsForCuts;
  const selectedModeText = purchaseMode === 'economy' ? 'экономичный' : 'минимальный';

  for (const cut of cuts) {
    cut.cellRef.pieces = selectedCutResult.cellPieces.get(cut.number) || [{ width: cut.width, height: cut.height, level: 1 }];
  }

  for (const cell of cells) {
    if (cell.isFull) {
      drawPanel(wall, scale, cell.x, cell.y, cell.width, cell.height, false, '', `${cell.cellName}: ${round(cell.width)}×${round(cell.height)} см`);
      continue;
    }

    const pieces = cell.pieces || [{ width: cell.width, height: cell.height, level: 1 }];
    let offsetX = 0;
    let offsetY = 0;

    for (let i = 0; i < pieces.length; i++) {
      const piece = pieces[i];
      const label = pieces.length === 1
        ? `#${cell.cutNumber}<br>${round(piece.width)}×${round(piece.height)} см`
        : `#${cell.cutNumber}.${i + 1}<br>${round(piece.width)}×${round(piece.height)} см`;

      drawPanel(
        wall,
        scale,
        cell.x + offsetX,
        cell.y + offsetY,
        piece.width,
        piece.height,
        true,
        label,
        `Подрезка #${cell.cutNumber}, часть ${i + 1}: ${round(piece.width)}×${round(piece.height)} см`
      );

      if (pieces.length > 1 && allSameHeight(pieces, cell.height)) offsetX += piece.width;
      else if (pieces.length > 1 && allSameWidth(pieces, cell.width)) offsetY += piece.height;
    }
  }

  const wallArea = wallW * wallH;
  const panelArea = panelW * panelH;
  const withReserve5 = Math.ceil(selectedPanelsNeeded * 1.05);
  const withReserve10 = Math.ceil(selectedPanelsNeeded * 1.10);
  const cutElementsOnWall = selectedCutResult.wallCutElements;
  const leftovers = selectedCutResult.leftovers;
  const leftoversArea = leftovers.reduce((sum, item) => sum + item.width * item.height, 0);
  const leftoversBySize = groupLeftoversBySize(leftovers);

  renderLeftovers(leftovers, panelW, panelH, selectedCutResult.panelsForCuts, leftoversArea, leftoversBySize);

  let cutsHtml = '';
  if (cuts.length > 0) {
    const cutList = cuts.map(c => {
      const pieces = selectedCutResult.cellPieces.get(c.number) || [];
      const piecesText = pieces.length > 1
        ? ` → ${pieces.map(p => `${round(p.width)}×${round(p.height)}`).join(' + ')}`
        : '';
      return `#${c.number}, ${c.cell}: ${round(c.width)}×${round(c.height)} см${piecesText}`;
    }).join('<br>');

    const panelsHtml = selectedCutResult.panels.map((p, i) => {
      const items = p.items.map(it => it.label).join(', ');
      const waste = p.waste.length
        ? `; осталось: ${p.waste.map(w => `${round(w.width)}×${round(w.height)}`).join(', ')}`
        : '; осталось: нет';
      return `Панель ${i + 1}: ${items}${waste}`;
    }).join('<br>');

    cutsHtml = `
      <br>
      <b>Подрезки (${cuts.length} мест, ${cutElementsOnWall} элементов на стене):</b><br>
      ${cutList}
      <br><br>
      <b>Раскрой цельных панелей под подрезки (${selectedCutResult.panelsForCuts} шт.):</b><br>
      ${panelsHtml}
    `;
  }

  const leftoversText = leftovers.length
    ? leftoversBySize.map(x => `${x.count} шт. ${x.size}`).join('<br>')
    : 'нет';

  result.innerHTML = `
    <b>Результат:</b><br>
    Размер стены: ${wallW}×${wallH} см<br>
    Размер панели: ${panelW}×${panelH} см<br>
    Режим расчёта: ${selectedModeText}<br><br>

    Целых панелей на стене: ${fullPanels}<br>
    Мест с подрезкой: ${cuts.length}<br>
    Резаных элементов на стене: ${cutElementsOnWall}<br>
    Цельных панелей, ушедших на подрезки: ${selectedCutResult.panelsForCuts}<br>
    Всего элементов на стене: ${fullPanels + cutElementsOnWall}<br><br>

    <b>Панелей к покупке: ${selectedPanelsNeeded}</b><br>
    С запасом 5%: ${withReserve5}<br>
    С запасом 10%: ${withReserve10}<br><br>

    <b>Остатки:</b><br>
    Количество остатков: ${leftovers.length}<br>
    Площадь остатков: ${round(leftoversArea / 10000)} м²<br>
    ${leftoversText}<br><br>

    <i style="color:#aaa;font-size:12px;">
      Для сравнения:<br>
      Минимальный, только 1 уровень подрезок: ${fullPanels + minimalCutResult.panelsForCuts}<br>
      Экономичный, многоуровневые остатки: ${fullPanels + economyCutResult.panelsForCuts}
    </i><br><br>

    Площадь стены: ${round(wallArea / 10000)} м²<br>
    Площадь панели: ${round(panelArea / 10000)} м²

    ${cutsHtml}

    <div class="legend">
      Сверху — номера колонок, слева — номера строк.
    </div>
  `;
}

function clearVisuals() {
  document.getElementById('wall').innerHTML = '';
  document.getElementById('columnLabels').innerHTML = '';
  document.getElementById('rowLabels').innerHTML = '';
  document.getElementById('leftoversSummary').innerHTML = '';
  document.getElementById('leftoversVisual').innerHTML = '';
}

function drawPanel(parent, scale, x, y, width, height, isCut, html, title) {
  const div = document.createElement('div');
  div.className = 'panel' + (isCut ? ' cut' : '');

  const pxW = width * scale;
  const pxH = height * scale;

  div.style.left = x * scale + 'px';
  div.style.top = y * scale + 'px';
  div.style.width = pxW + 'px';
  div.style.height = pxH + 'px';
  div.title = title;

  if (!isCut) {
    div.textContent = `${round(width)}×${round(height)} см`;
  } else if (pxW < 38 || pxH < 26) {
    div.classList.add('tiny-panel');
    div.innerHTML = html.split('<br>')[0];
  } else {
    if (pxW < 65 || pxH < 40) div.classList.add('small-panel');
    div.innerHTML = `<div class="cut-content"><div>${html.replace('<br>', '</div><div>')}</div></div>`;
  }

  parent.appendChild(div);
}

function calculateMinimalCuts(cuts, panelW, panelH) {
  const cellPieces = new Map();
  const panels = [];
  const leftovers = [];

  for (const cut of cuts) {
    const panelNumber = panels.length + 1;
    cellPieces.set(cut.number, [{ width: cut.width, height: cut.height, level: 1, sourcePanel: panelNumber }]);

    const waste = getWasteAfterCut(panelW, panelH, cut.width, cut.height)
      .map(w => ({ ...w, sourcePanel: panelNumber }));

    leftovers.push(...waste.map(w => ({ ...w })));

    panels.push({
      items: [{ label: `#${cut.number} ${round(cut.width)}×${round(cut.height)}` }],
      waste
    });
  }

  return {
    panelsForCuts: cuts.length,
    wallCutElements: cuts.length,
    cellPieces,
    panels,
    leftovers
  };
}

function calculateEconomyCuts(cuts, panelW, panelH) {
  const cellPieces = new Map();
  const panels = [];
  const stock = [];

  const ordered = [...cuts].sort((a, b) => b.area - a.area || b.width - a.width || b.height - a.height);

  for (let index = 0; index < ordered.length; index++) {
    const cut = ordered[index];
    const remaining = ordered.slice(index);

    let filled = null;
    if (canStockCoverAll(remaining, stock)) {
      filled = takePiecesFromStock(cut.width, cut.height, stock);
    }

    if (filled) {
      cellPieces.set(cut.number, filled.map(p => ({
        width: p.width,
        height: p.height,
        level: p.level,
        sourcePanel: p.sourcePanel
      })));
      continue;
    }

    const panelNumber = panels.length + 1;
    const waste = getWasteAfterCut(panelW, panelH, cut.width, cut.height)
      .map(w => ({ ...w, level: 2, sourcePanel: panelNumber }));

    for (const w of waste) stock.push({ ...w });

    panels.push({
      items: [{ label: `#${cut.number} ${round(cut.width)}×${round(cut.height)}` }],
      waste: []
    });

    cellPieces.set(cut.number, [{ width: cut.width, height: cut.height, level: 1, sourcePanel: panelNumber }]);
  }

  for (const [cutNumber, pieces] of cellPieces) {
    if (pieces.length <= 1) continue;
    for (const piece of pieces) {
      if (!piece.sourcePanel) continue;
      const panel = panels[piece.sourcePanel - 1];
      if (panel) panel.items.push({ label: `#${cutNumber} часть ${round(piece.width)}×${round(piece.height)}` });
    }
  }

  for (const s of stock) {
    const panel = panels[s.sourcePanel - 1];
    if (panel) panel.waste.push({ width: s.width, height: s.height, sourcePanel: s.sourcePanel });
  }

  const wallCutElements = [...cellPieces.values()].reduce((sum, pieces) => sum + pieces.length, 0);
  const leftovers = stock.map(s => ({ ...s }));

  return {
    panelsForCuts: panels.length,
    wallCutElements,
    cellPieces,
    panels,
    leftovers
  };
}

function getWasteAfterCut(panelW, panelH, cutW, cutH) {
  const waste = [];

  if (cutW > panelW || cutH > panelH) return waste;

  const rightW = panelW - cutW;
  const bottomH = panelH - cutH;

  if (rightW > 0) waste.push({ width: rightW, height: cutH });
  if (bottomH > 0) waste.push({ width: panelW, height: bottomH });

  return waste.filter(w => w.width > 0 && w.height > 0);
}

function canStockCoverAll(cuts, stock) {
  const clonedStock = stock.map(s => ({ ...s }));
  for (const cut of cuts) {
    const pieces = takePiecesFromStock(cut.width, cut.height, clonedStock);
    if (!pieces) return false;
  }
  return true;
}

function takePiecesFromStock(width, height, stock) {
  for (let i = 0; i < stock.length; i++) {
    const s = stock[i];
    if (sameSize(s.width, s.height, width, height)) {
      stock.splice(i, 1);
      return [{ ...s, width, height }];
    }
  }

  let candidate = findSubsetBySum(stock, s => same(s.height, height) && s.width <= width, s => s.width, width);
  if (candidate) return removeSubset(stock, candidate);

  candidate = findSubsetBySum(stock, s => same(s.width, width) && s.height <= height, s => s.height, height);
  if (candidate) return removeSubset(stock, candidate);

  return null;
}

function findSubsetBySum(items, predicate, valueGetter, target) {
  const filtered = items
    .map((item, index) => ({ item, index }))
    .filter(x => predicate(x.item))
    .sort((a, b) => valueGetter(b.item) - valueGetter(a.item));

  function search(pos, sum, picked) {
    if (same(sum, target)) return picked;
    if (sum > target || pos >= filtered.length) return null;

    for (let i = pos; i < filtered.length; i++) {
      const value = valueGetter(filtered[i].item);
      const result = search(i + 1, sum + value, [...picked, filtered[i].index]);
      if (result) return result;
    }

    return null;
  }

  return search(0, 0, []);
}

function removeSubset(stock, indexes) {
  const sorted = [...indexes].sort((a, b) => b - a);
  const pieces = [];
  for (const index of sorted) pieces.unshift(stock.splice(index, 1)[0]);
  return pieces;
}

function renderLeftovers(leftovers, panelW, panelH, panelsForCuts, leftoversArea, leftoversBySize) {
  const summary = document.getElementById('leftoversSummary');
  const visual = document.getElementById('leftoversVisual');

  if (!leftovers.length) {
    summary.innerHTML = `Остатков нет. Панелей под подрезки использовано: ${panelsForCuts}.`;
    visual.innerHTML = '<div class="no-leftovers">Нечего показывать.</div>';
    return;
  }

  summary.innerHTML = `
    Всего остатков: <b>${leftovers.length}</b><br>
    Площадь остатков: <b>${round(leftoversArea / 10000)} м²</b><br>
    По размерам: ${leftoversBySize.map(x => `<b>${x.count} шт.</b> ${x.size}`).join(', ')}
  `;

  const byPanel = new Map();
  for (const item of leftovers) {
    const key = item.sourcePanel || 0;
    if (!byPanel.has(key)) byPanel.set(key, []);
    byPanel.get(key).push(item);
  }

  for (const [panelNumber, pieces] of byPanel) {
    const card = document.createElement('div');
    card.className = 'leftover-card';

    const title = document.createElement('div');
    title.className = 'leftover-card-title';
    title.textContent = panelNumber ? `Панель ${panelNumber}` : 'Без источника';
    card.appendChild(title);

    const piecesBox = document.createElement('div');
    piecesBox.className = 'leftover-pieces';

    for (const piece of pieces) {
      const div = document.createElement('div');
      div.className = 'leftover-piece';
      div.style.width = Math.max(42, piece.width / panelW * 150) + 'px';
      div.style.height = Math.max(28, piece.height / panelH * 110) + 'px';
      div.title = `${round(piece.width)}×${round(piece.height)} см`;
      div.innerHTML = `${round(piece.width)}×${round(piece.height)}<br>см`;
      piecesBox.appendChild(div);
    }

    card.appendChild(piecesBox);
    visual.appendChild(card);
  }
}

function groupLeftoversBySize(leftovers) {
  const map = new Map();

  for (const item of leftovers) {
    const key = `${round(item.width)}×${round(item.height)} см`;
    map.set(key, (map.get(key) || 0) + 1);
  }

  return [...map.entries()]
    .map(([size, count]) => ({ size, count }))
    .sort((a, b) => b.count - a.count || a.size.localeCompare(b.size));
}

function sameSize(w1, h1, w2, h2) {
  return same(w1, w2) && same(h1, h2);
}

function same(a, b) {
  return Math.abs(a - b) < 0.0001;
}

function allSameHeight(pieces, height) {
  return pieces.every(p => same(p.height, height));
}

function allSameWidth(pieces, width) {
  return pieces.every(p => same(p.width, width));
}

function round(value) {
  return Math.round(value * 100) / 100;
}

window.addEventListener('resize', render);
updateModeDesc();
render();
</script>
